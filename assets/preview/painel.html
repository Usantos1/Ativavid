<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATIVAVID — Painel</title>
<link rel="icon" href="/assets/ativa-vid-icon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/ativa-vid-icon.png">
<script>
  (function () {
    var t = localStorage.getItem('ativavid-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/painel.css">
</head>
<body class="painel-body">

<header class="glass">
  <div class="logo-chip"><img src="/assets/ativa-vid-logo.png" alt="ATIVAVID"></div>
  <div class="head-info">
    <div class="project-name">Painel</div>
    <div id="rootsLine" class="state-message"></div>
  </div>
  <div class="head-actions">
    <span id="counts" class="pn-counts"></span>
    <button id="btnReload" class="btn ghost">Atualizar</button>
    <button type="button" id="btnTheme" class="theme-toggle" title="Alternar tema claro/escuro" aria-label="Tema">
      <svg class="theme-ico theme-ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-ico theme-ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
    </button>
  </div>
</header>

<main class="pn-main">
  <div id="alerts" class="pn-alerts"></div>
  <div id="grid" class="pn-grid">
    <div class="pn-empty">carregando…</div>
  </div>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/assets/painel.js"></script>
</body>
</html>
